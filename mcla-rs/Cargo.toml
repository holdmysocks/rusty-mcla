[workspace]
resolver = "2"
members = ["crates/formats", "crates/flash", "crates/tool", "crates/game", "crates/config", "crates/install", "crates/savedecode", "crates/shaders"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
memmap2 = "0.9"
aes = "0.8"
cipher = "0.4"
lzxd = "0.2"
flate2 = "1"
rayon = "1"
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
hashbrown = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
debug = 1
codegen-units = 4
lto = "thin"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
